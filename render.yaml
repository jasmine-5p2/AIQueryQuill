services:
  - type: web
    name: aiqueryquill-api
    runtime: python
    plan: free
    buildCommand: cd backend-django && pip install -r requirements.txt && python manage.py migrate
    startCommand: cd backend-django && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: aiqueryquill-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://aiqueryquill-web.onrender.com
      - key: DB_ENGINE
        value: sqlite
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b

  - type: web
    name: aiqueryquill-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://aiqueryquill-api.onrender.com
